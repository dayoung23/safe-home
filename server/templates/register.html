<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Safe Home 회원가입</title>
<style>
  body { font-family: sans-serif; max-width: 360px; margin: 60px auto; }
  input, button { display: block; width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
  #msg { color: #c00; }
</style>
</head>
<body>
<h2>회원가입</h2>
<input id="username" placeholder="아이디 (20자 이내)">
<input id="password" type="password" placeholder="비밀번호 (4자 이상)">
<input id="name" placeholder="이름 (알림에 표시돼요)">
<button id="btn">가입하기</button>
<p id="msg"></p>
<p><a href="/login">로그인으로</a></p>

<script>
const $ = (id) => document.getElementById(id);

$("btn").onclick = async () => {
  const res = await fetch("/api/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: $("username").value,
      password: $("password").value,
      name: $("name").value,
    }),
  });
  const data = await res.json();
  if (data.ok) {
    alert("가입 완료! 로그인해 주세요.");
    location.href = "/login";
  } else {
    $("msg").textContent = data.error;
  }
};
</script>
</body>
</html>
