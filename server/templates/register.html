{% extends "base.html" %}
{% block title %}Safe Home · 회원가입{% endblock %}
{% block screen %}
<div class="page auth">
  <a class="back" href="/login"><svg class="i"><use href="#i-left"/></svg>로그인</a>
  <div class="brand" style="margin-top:6px">
    <h1>회원가입</h1>
    <p>가족 모두가 같은 집을 지킬 수 있어요.<br>가입 후 도어락 리듬을 등록하면 귀가를 알아봐요.</p>
  </div>
  <form id="form" autocomplete="off">
    <div class="field"><label for="name">이름</label><input id="name" maxlength="20" placeholder="알림에 표시될 이름"></div>
    <div class="field"><label for="username">아이디</label><input id="username" maxlength="20" placeholder="20자 이내"></div>
    <div class="field"><label for="password">비밀번호</label><input id="password" type="password" placeholder="4자 이상"></div>
    <div class="field"><label for="password2">비밀번호 확인</label><input id="password2" type="password" placeholder="한 번 더 입력"></div>
    <div class="form-msg" id="msg"></div>
    <button class="btn primary block" id="btn" type="submit">가입하고 시작하기</button>
  </form>
  <div class="auth-foot">이미 계정이 있나요? <a href="/login">로그인</a></div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = (id) => document.getElementById(id).value;
  const btn = document.getElementById("btn"), msg = document.getElementById("msg");
  msg.textContent = "";
  if (v("password") !== v("password2")) { msg.textContent = "비밀번호가 서로 달라요"; return; }
  btn.disabled = true; btn.textContent = "가입 중...";
  try {
    const body = { name: v("name").trim(), username: v("username").trim(), password: v("password") };
    const r = await SH.api("/api/register", { json: body });
    if (r.data && r.data.ok) {
      const l = await SH.api("/api/login", { json: { username: body.username, password: body.password } });
      if (l.data && l.data.ok) { location.href = "/"; return; }
      location.href = "/login"; return;
    }
    msg.textContent = (r.data && r.data.error) || "가입에 실패했어요";
  } catch { msg.textContent = "서버에 연결할 수 없어요"; }
  btn.disabled = false; btn.textContent = "가입하고 시작하기";
});
</script>
{% endblock %}
