<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Safe Home 로그인</title>
<style>
  body { font-family: sans-serif; max-width: 360px; margin: 60px auto; }
  input, button { display: block; width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
  #msg { color: #c00; }
</style>
</head>
<body>
<h2>Safe Home 로그인</h2>
<input id="username" placeholder="아이디">
<input id="password" type="password" placeholder="비밀번호">
<button id="btn">로그인</button>
<p id="msg"></p>
<p><a href="/register">회원가입</a></p>

<script>
const $ = (id) => document.getElementById(id);

async function login() {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("username").value, password: $("password").value }),
  });
  const data = await res.json();
  if (data.ok) location.href = "/";
  else $("msg").textContent = data.error;
}

$("btn").onclick = login;
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
